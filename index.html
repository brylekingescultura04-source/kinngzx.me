<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- TAB TITLE -->
  <title>kinngzx_ | Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
    }

    body {
      position: relative;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 70% 40%, rgba(162, 0, 255, 0.17), transparent 30%),
        radial-gradient(circle at 30% 65%, rgba(98, 0, 255, 0.12), transparent 30%),
        linear-gradient(135deg, #030303, #0a0a0a, #030303);
      z-index: -5;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(1px);
    }

    /* MOVING BACKGROUND GLOW */

    .background-orb {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(120, 0, 255, 0.14);
      filter: blur(120px);
      z-index: -4;
      animation: orbMove 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes orbMove {
      0% {
        left: 5%;
        top: 10%;
      }

      50% {
        left: 60%;
        top: 55%;
      }

      100% {
        left: 20%;
        top: 70%;
      }
    }

    /* =========================
       STARS
    ========================= */

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -3;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,
      100% {
        opacity: 0.15;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.6);
      }
    }

    /* =========================
       MOUSE GLOW
    ========================= */

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      background: rgba(140, 0, 255, 0.18);
      filter: blur(120px);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: -2;
    }

    /* =========================
       ENTER SCREEN
    ========================= */

    .enter-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #050505;
      z-index: 999;
      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .entrance-picture {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
    }

    .entrance-picture.loaded {
      opacity: 1;
    }

    .enter-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.52), rgba(0, 0, 0, 0.66)),
        radial-gradient(circle at center, rgba(126, 34, 206, 0.08), transparent 55%);
      pointer-events: none;
      z-index: 1;
    }

    .enter-title,
    .enter-subtitle {
      position: relative;
      z-index: 2;
    }

    .enter-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .enter-title {
      font-size: clamp(34px, 6vw, 64px);
      font-weight: 900;
      letter-spacing: 10px;
      text-shadow:
        0 0 8px #a300ff,
        0 0 25px #7b00ff,
        0 0 55px rgba(123, 0, 255, 0.45);
      animation:
        pulse 2s infinite,
        enterFloat 4s ease-in-out infinite;
    }

    .enter-subtitle {
      margin-top: 15px;
      color: #999;
      font-size: 13px;
      letter-spacing: 4px;
      animation: subtitleFade 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.75;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes enterFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes subtitleFade {
      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================
       MAIN WRAPPER
    ========================= */

    .main {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1000px;
    }

/* =====================================
   LIVE / GIF BACKGROUND
===================================== */

.live-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -10;
  background: #030303;
}


/* VIDEO */

.background-video {
  position: absolute;

  width: 100%;
  height: 100%;

  object-fit: cover;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(1.04);

  filter:
    brightness(0.62)
    contrast(1.05)
    saturate(0.9);

  animation:
    backgroundZoom 18s
    ease-in-out infinite alternate;
}


/* GIF */

.background-gif {
  position: absolute;

  width: 100%;
  height: 100%;

  object-fit: cover;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(1.04);

  filter:
    brightness(0.62)
    contrast(1.05)
    saturate(0.9);

  animation:
    backgroundZoom 18s
    ease-in-out infinite alternate;
}


/* VERY SLOW CINEMATIC ZOOM */

@keyframes backgroundZoom {

  from {
    transform:
      translate(-50%, -50%)
      scale(1.04);
  }

  to {
    transform:
      translate(-50%, -50%)
      scale(1.10);
  }

}


/* DARK GRADIENT */

.background-overlay {
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at center,
      rgba(0, 0, 0, 0.05),
      rgba(0, 0, 0, 0.48)
    ),
    linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.22),
      rgba(0, 0, 0, 0.48)
    );
}
    .card-float-wrapper {
      animation: floatingCard 5s ease-in-out infinite;
    }

    @keyframes floatingCard {
      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      width: min(460px, 94vw);
      padding: 35px 30px;
      background: rgba(15, 15, 15, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 40px rgba(115, 0, 255, 0.15),
        inset 0 0 20px rgba(255, 255, 255, 0.02);
      text-align: center;
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
      animation: cardIn 1s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        130deg,
        transparent,
        rgba(180, 80, 255, 0.5),
        transparent
      );
      pointer-events: none;
      opacity: 0.4;
    }

    /* =========================
       AVATAR
    ========================= */

    .avatar-wrapper {
      width: 115px;
      height: 115px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(
        135deg,
        #a800ff,
        #4d00ff,
        #ffffff
      );
      box-shadow: 0 0 30px rgba(137, 0, 255, 0.4);
      position: relative;
      animation: avatarPulse 2.5s ease-in-out infinite;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #b35cff;
      border-right-color: rgba(255, 255, 255, 0.7);
      animation: avatarRotate 4s linear infinite;
      pointer-events: none;
    }

    .avatar-wrapper::after {
      content: "";
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: rgba(130, 0, 255, 0.08);
      filter: blur(10px);
      z-index: -1;
    }

    @keyframes avatarRotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes avatarPulse {
      0%,
      100% {
        box-shadow:
          0 0 20px rgba(137, 0, 255, 0.35),
          0 0 40px rgba(137, 0, 255, 0.15);
      }

      50% {
        box-shadow:
          0 0 35px rgba(180, 70, 255, 0.8),
          0 0 70px rgba(137, 0, 255, 0.35);
      }
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: #111;
      border: 4px solid #0a0a0a;
    }

    /* =========================
   USERNAME + VERIFIED BADGE
========================= */

.username {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;

  font-size: 31px;
  font-weight: 800;

  margin-bottom: 8px;

  letter-spacing: -1px;

  animation:
    usernameGlow 3s
    ease-in-out infinite;
}


.username-text {
  display: inline-block;
}


.purple-letter {
  color: #b35cff;
}


/* VERIFIED BADGE */

.verified-badge {
  width: 22px;
  height: 22px;

  display: inline-flex;

  justify-content: center;
  align-items: center;

  position: relative;

  transform: translateY(1px);

  filter:
    drop-shadow(
      0 0 6px
      rgba(170, 80, 255, 0.65)
    );

  animation:
    verifiedFloat
    3s ease-in-out infinite;
}


.verified-badge svg {
  width: 100%;
  height: 100%;

  overflow: visible;
}


/* badge body */

.verified-badge svg > path:first-child {
  fill: #a94cff;

  stroke:
    rgba(255, 255, 255, 0.35);

  stroke-width: 0.6;
}


/* white check */

.verified-badge .check {
  fill: none;

  stroke: white;

  stroke-width: 2.3;

  stroke-linecap: round;
  stroke-linejoin: round;
}


@keyframes verifiedFloat {

  0%,
  100% {

    transform:
      translateY(1px)
      scale(1);

    filter:
      drop-shadow(
        0 0 5px
        rgba(170, 80, 255, 0.45)
      );

  }


  50% {

    transform:
      translateY(-1px)
      scale(1.07);

    filter:
      drop-shadow(
        0 0 10px
        rgba(190, 100, 255, 0.9)
      );

  }

}


@keyframes usernameGlow {

  0%,
  100% {

    text-shadow:
      0 0 4px
      rgba(179, 92, 255, 0.2);

  }


  50% {

    text-shadow:
      0 0 10px
      rgba(179, 92, 255, 0.8),

      0 0 25px
      rgba(120, 0, 255, 0.45);

  }

}



    /* =========================
       PROFILE NOTE / STATUS BUBBLE
    ========================= */
    .profile-note {
      position: absolute;
      top: -18px;
      left: 92px;
      width: max-content;
      max-width: 205px;
      margin: 0;
      padding: 9px 13px;
      color: rgba(255, 255, 255, 0.94);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1px;
      line-height: 1.35;
      text-align: left;
      background: rgba(8, 5, 12, 0.82);
      border: 1px solid rgba(179, 92, 255, 0.48);
      border-radius: 13px;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.3),
        0 0 18px rgba(145, 45, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: noteFloat 4s ease-in-out infinite;
      z-index: 5;
      pointer-events: none;
    }

    .profile-note::before {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 12px;
      width: 10px;
      height: 10px;
      transform: rotate(45deg);
      background: rgba(8, 5, 12, 0.9);
      border-left: 1px solid rgba(179, 92, 255, 0.48);
      border-bottom: 1px solid rgba(179, 92, 255, 0.48);
    }

    .profile-note .note-icon {
      margin-right: 5px;
      filter: drop-shadow(0 0 5px rgba(179, 92, 255, 0.55));
    }

    @keyframes noteFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    @media (max-width: 520px) {
      .profile-note {
        top: -14px;
        left: 78px;
        max-width: 170px;
        padding: 8px 11px;
        font-size: 11px;
      }
    }


    /* =========================
       PROFILE LOCAL TIME / DISCORD STATUS
    ========================= */
    .profile-meta-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 7px auto 14px;
      padding: 7px 10px;
      width: fit-content;
      max-width: 100%;
      color: rgba(255, 255, 255, 0.82);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15px;
      background: rgba(10, 7, 16, 0.55);
      border: 1px solid rgba(179, 92, 255, 0.18);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .profile-meta-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #777;
      box-shadow: 0 0 8px rgba(160,160,160,.35);
    }

    .profile-meta-dot.online { background: #43d17b; box-shadow: 0 0 9px rgba(67,209,123,.65); }
    .profile-meta-dot.idle { background: #f0b84b; box-shadow: 0 0 9px rgba(240,184,75,.6); }
    .profile-meta-dot.dnd { background: #ef5a67; box-shadow: 0 0 9px rgba(239,90,103,.6); }
    .profile-meta-dot.offline { background: #777; box-shadow: 0 0 8px rgba(160,160,160,.35); }

    .profile-meta-separator {
      color: rgba(179, 92, 255, 0.7);
    }

    .profile-local-time {
      color: #d6b3ff;
      text-shadow: 0 0 8px rgba(179,92,255,.25);
    }

    @media (max-width: 520px) {
      .profile-meta-pill {
        font-size: 10px;
        padding: 6px 9px;
        gap: 5px;
      }
    }

    /* =========================
       BIO
    ========================= */

    .bio {
      color: #aaa;
      font-size: 14px;
      line-height: 1.7;
      margin: 0 auto 22px;
      max-width: 340px;
      min-height: 48px;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #b35cff;
      margin-left: 3px;
      vertical-align: middle;
      animation: cursorBlink 0.8s infinite;
    }

    @keyframes cursorBlink {
      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    /* =========================
       STATUS BOX
    ========================= */

    .status-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 13px 15px;
      margin-bottom: 20px;
      transition: 0.3s ease;
    }

    .status-box:hover {
      background: rgba(130, 0, 255, 0.11);
      border-color: rgba(180, 80, 255, 0.25);
      transform: translateY(-2px);
    }

    .status-icon {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #7b00ff,
        #d000ff
      );
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(150, 0, 255, 0.25);
      animation: statusPulse 1.8s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow:
          0 0 12px rgba(150, 0, 255, 0.25);
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 25px rgba(170, 70, 255, 0.7);
      }
    }

    .status-title {
      font-weight: 700;
      font-size: 14px;
    }

    .status-text {
      color: #8f8f8f;
      font-size: 12px;
      margin-top: 3px;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .link-btn {
      padding: 13px 12px;
      border-radius: 13px;
      text-decoration: none;
      color: white;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 700;
      transition: 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.18),
        transparent
      );
      transition: 0.6s;
    }

    .link-btn:hover::before {
      left: 140%;
    }

    .link-btn:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(142, 0, 255, 0.16);
      border-color: rgba(174, 83, 255, 0.5);
      box-shadow:
        0 8px 25px rgba(123, 0, 255, 0.15);
    }

    /* =========================
       BOTTOM INFO
    ========================= */

    .bottom-info {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 22px;
      color: #888;
      font-size: 12px;
    }

    .views {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* =========================
       GLOBAL HEART COUNTER
    ========================= */

    .heart-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .heart-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: #aaa;
      font: inherit;
      padding: 2px 4px;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform .2s ease, color .2s ease, text-shadow .2s ease;
    }

    .heart-btn:hover {
      color: #d9a7ff;
      transform: translateY(-1px) scale(1.04);
    }

    .heart-btn.liked {
      color: #c45cff;
      text-shadow: 0 0 12px rgba(196, 92, 255, .7);
    }

    .heart-btn.pop {
      animation: heartPop .42s ease;
    }

    .heart-btn:disabled {
      cursor: default;
      opacity: 1;
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.28); }
      70% { transform: scale(.94); }
      100% { transform: scale(1); }
    }

  }

}

    /* =========================
       MUSIC BUTTON
    ========================= */

    .music-btn {
      position: fixed;
      top: 22px;
      left: 22px;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 23px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      transition: 0.25s ease;
      z-index: 20;
    }


    .music-btn:hover {
      transform: scale(1.08);
      background: rgba(100, 0, 180, 0.25);
    }

    .music-btn.playing {

          MUSIC_TARGET_VOLUME,
          music.volume + volumeStep
        );

        if (music.volume >= MUSIC_TARGET_VOLUME - 0.001) {
          music.volume = MUSIC_TARGET_VOLUME;
          clearInterval(musicFadeTimer);
          musicFadeTimer = null;
        }
      }, stepTime);
    }

      clearInterval(musicFadeTimer);

      const steps = 20;
      const stepTime = 500 / steps;
      const volumeStep = startVolume / steps;

      musicFadeTimer = setInterval(() => {
        music.volume = Math.max(0, music.volume - volumeStep);

        if (music.volume <= 0.001) {
          music.volume = 0;
          clearInterval(musicFadeTimer);
          musicFadeTimer = null;
          if (callback) callback();

let currentRotateX = 0;
let currentRotateY = 0;

let targetRotateX = 0;
let targetRotateY = 0;

let currentMoveX = 0;
let currentMoveY = 0;

let targetMoveX = 0;
let targetMoveY = 0;


/*
  Small values lang para hindi OA.
  Pwede natin baguhin later.
*/

const MAX_ROTATION = 3.5;
const MAX_MOVEMENT = 5;


document.addEventListener(
  "mousemove",
  (event) => {

    const normalizedX =
      (
        event.clientX /
        window.innerWidth
      ) * 2 - 1;


    const normalizedY =
      (
        event.clientY /
        window.innerHeight
      ) * 2 - 1;


    /*
      Parang tumitingin yung card
      towards the mouse.
    */

    targetRotateY =
      normalizedX *
      MAX_ROTATION;


    targetRotateX =
      normalizedY *
      -MAX_ROTATION;


    /*
      Very slight movement
    */

    targetMoveX =
      normalizedX *
      MAX_MOVEMENT;


    targetMoveY =
      normalizedY *
      MAX_MOVEMENT;

  }
);


/*
  Kapag lumabas mouse sa window,
  dahan-dahang babalik sa center.
*/

document.addEventListener(
  "mouseleave",
  () => {

    targetRotateX = 0;
    targetRotateY = 0;

    targetMoveX = 0;
    targetMoveY = 0;

  }
);


/*
  Smooth animation gamit
  interpolation / easing.
*/

function animateCardFollow() {

  currentRotateX +=
    (
      targetRotateX -
      currentRotateX
    ) * 0.06;


  currentRotateY +=
    (
      targetRotateY -
      currentRotateY
    ) * 0.06;


  currentMoveX +=
    (
      targetMoveX -
      currentMoveX
    ) * 0.06;


  currentMoveY +=
    (
      targetMoveY -
      currentMoveY
    ) * 0.06;


  profileCard.style.transform =
    `
      translate3d(
        ${currentMoveX}px,
        ${currentMoveY}px,
        0
      )

      rotateX(
        ${currentRotateX}deg
      )

      rotateY(
        ${currentRotateY}deg
      )
    `;


  requestAnimationFrame(
    animateCardFollow
  );

}

    function formatTime(ms) {
      if (!Number.isFinite(ms) || ms < 0) ms = 0;
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function formatElapsed(ms) {
      if (!Number.isFinite(ms) || ms < 0) ms = 0;
      const total = Math.floor(ms / 1000);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      if (hours > 0) {
        return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

      if (serverTimeBaseMs !== null) {

        profileLocalTime.textContent = formatManilaTime(

    async function syncSupabaseServerTime() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/get_server_time`,
          {
            method: "POST",
            headers: {
              ...SUPABASE_HEADERS,
              "Content-Type": "application/json"
            },
            body: "{}",
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(`Server time failed: ${response.status}`);
        }

        const raw = await response.json();
        const serverDate = new Date(raw);

        if (Number.isNaN(serverDate.getTime())) {
          throw new Error("Invalid Supabase server time");
        }

        serverTimeBaseMs = serverDate.getTime();
        serverTimeSyncedAt = performance.now();
        updateProfileLocalTime();
      } catch (error) {
        console.warn("Could not sync Supabase server time:", error);
      }
    }

    function updateProfileMetaStatus(status = "offline") {
      const safeStatus = ["online", "idle", "dnd", "offline"].includes(status)
        ? status
        : "offline";

      if (profileMetaDot) {
        profileMetaDot.className = `profile-meta-dot ${safeStatus}`;
      }

      if (profileMetaStatus) {
        profileMetaStatus.textContent = getStatusLabel(safeStatus);
      }
    }

    updateProfileLocalTime();
    syncSupabaseServerTime();
    setInterval(updateProfileLocalTime, 1000);
    setInterval(syncSupabaseServerTime, 60000);

    function renderPresence(presence) {
      currentPresence = presence;
      updateProfileMetaStatus(presence?.discord_status || "offline");
      clearPresenceTimers();

      if (!presence) {
        presenceCard.innerHTML = `<div class="presence-loading">Discord presence unavailable.</div>`;
        return;
      }

      const activities = Array.isArray(presence.activities)
        ? presence.activities
        : [];

      /*
        Discord activity types:
        0 = Playing
        1 = Streaming
        2 = Listening (Spotify is rendered separately)
        3 = Watching
        4 = Custom Status (skip)
        5 = Competing

        We skip Spotify/type 2 and Custom Status/type 4 here.
      */
      const mainActivity = activities.find(activity =>
        activity &&
        activity.type !== 2 &&
        activity.type !== 4
      );

      const hasSpotify = Boolean(
        presence.listening_to_spotify && presence.spotify
      );

      if (!mainActivity && !hasSpotify) {
        renderIdle(presence);
        return;
      }

      let html = "";

      /* Game / app stays on top */
      if (mainActivity) {
        html += buildActivitySection(presence, mainActivity);
      }

      /* Same card, just a separator when both are active */
      if (mainActivity && hasSpotify) {
        html += `<div class="presence-divider"></div>`;
      }

      /* Spotify stays inside the SAME activity card */
      if (hasSpotify) {
        html += buildSpotifySection(presence);
      }

      presenceCard.innerHTML = html;

      updateLivePresenceTimers();
      progressTimer = setInterval(updateLivePresenceTimers, 1000);
    }

    async function fetchInitialPresence() {
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const json = await response.json();
        if (json.success) {
          renderPresence(json.data);
        }
      } catch (error) {
        console.log("Initial Lanyard fetch failed.", error);
      }
    }

    function connectLanyard() {
      if (lanyardSocket && (lanyardSocket.readyState === WebSocket.OPEN || lanyardSocket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      lanyardSocket = new WebSocket("wss://api.lanyard.rest/socket");

      lanyardSocket.addEventListener("message", event => {
        let payload;
        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload.op === 1) {
          if (heartbeatTimer) clearInterval(heartbeatTimer);

          lanyardSocket.send(JSON.stringify({
            op: 2,
            d: { subscribe_to_id: DISCORD_USER_ID }
          }));

          heartbeatTimer = setInterval(() => {
            if (lanyardSocket?.readyState === WebSocket.OPEN) {
              lanyardSocket.send(JSON.stringify({ op: 3 }));
            }
          }, payload.d.heartbeat_interval);
        }

        if (payload.op === 0 && payload.t === "INIT_STATE") {
          renderPresence(payload.d);
        }

        if (payload.op === 0 && payload.t === "PRESENCE_UPDATE") {
          renderPresence(payload.d);
        }
      });

      lanyardSocket.addEventListener("close", () => {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectLanyard, 5000);
      });

      lanyardSocket.addEventListener("error", () => {
        try { lanyardSocket.close(); } catch {}
      });
    }

    fetchInitialPresence();
    connectLanyard();

  

    // ===== CUSTOM PURPLE GLOW CURSOR =====
    (() => {
      const dot = document.getElementById("kingCursorDot");
      const ring = document.getElementById("kingCursorRing");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");

      if (!dot || !ring || !finePointer.matches) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let ringX = mouseX;
      let ringY = mouseY;
      let visible = false;
      let rafId = null;

      const interactiveSelector = [
        "a",
        "button",
        "[role='button']",
        ".music-btn",
        ".heart-btn"
      ].join(",");

      function showCursor() {
        if (visible) return;
        visible = true;
        dot.style.opacity = "1";
        ring.style.opacity = "1";
      }

      function hideCursor() {
        visible = false;
        dot.style.opacity = "0";
        ring.style.opacity = "0";
        ring.classList.remove("is-hovering", "is-clicking");
      }

      function animateCursor() {
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;

        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

        rafId = requestAnimationFrame(animateCursor);
      }

      document.addEventListener("pointermove", event => {
        if (event.pointerType && event.pointerType !== "mouse") return;
        mouseX = event.clientX;
        mouseY = event.clientY;
        showCursor();

        const interactive = event.target.closest?.(interactiveSelector);
        ring.classList.toggle("is-hovering", Boolean(interactive));
      }, { passive: true });

      document.addEventListener("pointerdown", event => {
        if (event.pointerType && event.pointerType !== "mouse") return;
        ring.classList.add("is-clicking");
      }, { passive: true });

      document.addEventListener("pointerup", event => {
        if (event.pointerType && event.pointerType !== "mouse") return;
        ring.classList.remove("is-clicking");
      }, { passive: true });

      document.addEventListener("mouseleave", hideCursor);
      window.addEventListener("blur", hideCursor);

      rafId = requestAnimationFrame(animateCursor);

      finePointer.addEventListener?.("change", e => {
        if (!e.matches) {
          hideCursor();
          if (rafId) cancelAnimationFrame(rafId);
        }
      });
    })();

</script>

</body>
